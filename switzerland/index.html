<!DOCTYPE HTML>
<html lang="en">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-3ZY845XSCQ"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-3ZY845XSCQ');
  </script>

  <meta charset="UTF-8">
  <title>Touching All 26 Cantons</title>
  <meta name="author" content="Mateo Guaman Castro">
  <meta name="description" content="A side quest: touching every one of Switzerland's 26 cantons.">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link rel="stylesheet" type="text/css" href="style.css">
</head>

<body>
  <div class="page" id="top">
    <nav class="topbar">
      <a href="../index.html">Mateo Guaman Castro</a>
    </nav>

    <header class="masthead">
      <h1>Touching all 26 cantons</h1>
      <p class="lede">A side quest: set foot in, and lay a hand on, every one of Switzerland's 26 cantons.</p>
    </header>

    <section class="atlas">
      <div class="map-col">
        <svg id="map" role="img" aria-label="Map of Switzerland's 26 cantons. Touched cantons are shown in red."></svg>
      </div>
      <aside class="side">
        <p class="count"><span id="count">00</span><span class="count-total">/26</span></p>
        <p class="count-label">cantons touched</p>
        <div class="readout" id="readout" aria-live="polite"></div>
        <p class="legend">
          <span class="swatch swatch-touched"></span>Touched
          <span class="swatch swatch-todo"></span>Not yet
        </p>
      </aside>
    </section>

    <p class="notice" id="notice" hidden></p>

    <article class="story" id="story" hidden></article>

    <!-- The canton list. Delete this whole section to drop it; nothing else depends on it. -->
    <section class="index" id="index">
      <h2 class="section-label">Cantons</h2>
      <div class="index-grid" id="index-grid"></div>
    </section>

    <footer class="credits">
      Canton boundaries: Bundesamt für Statistik (BFS), GEOSTAT, via
      <a href="https://github.com/interactivethings/swiss-maps">swiss-maps</a>.
    </footer>
  </div>

  <dialog class="lightbox" id="lightbox" aria-label="Photo viewer">
    <button class="lb-btn lb-close" id="lb-close" aria-label="Close">&times;</button>
    <button class="lb-btn lb-prev" id="lb-prev" aria-label="Previous photo">&larr;</button>
    <div class="lb-media" id="lb-media"></div>
    <button class="lb-btn lb-next" id="lb-next" aria-label="Next photo">&rarr;</button>
    <p class="lb-caption" id="lb-caption"></p>
  </dialog>

  <script src="map-data.js"></script>
  <script src="markdown.js"></script>
  <script src="app.js"></script>
</body>
</html>
